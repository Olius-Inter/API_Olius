name: olius-local

services:
  postgres-dev:
    image: postgres:16.15
    environment:
      POSTGRES_DB: ${CONTAINER_DEV_NAME:?Defina CONTAINER_DEV_NAME no .env}
      POSTGRES_USER: ${CONTAINER_DEV_ADMIN_USER:?Defina CONTAINER_DEV_ADMIN_USER no .env}
      POSTGRES_PASSWORD: ${CONTAINER_DEV_ADMIN_PASSWORD:?Defina CONTAINER_DEV_ADMIN_PASSWORD no .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-dev-data: