# Ativar exclusivamente com SPRING_PROFILES_ACTIVE=prod.
# Credenciais fornecidas pela hospedagem. Não importar o .env local.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Produção usa chaves persistentes e cookies HTTPS, mesmo que as
# variáveis de conveniência OLIUS_* tenham valores locais.
olius.security.ephemeral-keys=false
olius.security.cookie-secure=true
