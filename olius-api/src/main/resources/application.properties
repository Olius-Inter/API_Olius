### Nome da API ###
spring.application.name=olius-core-api

### Hibernate ###
spring.jpa.hibernate.ddl-auto=validate

### Erros SQL podem incluir valores pessoais; diagnóstico seguro fica no handler ###
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.orm.jdbc.warn=OFF


### Sessões JPA terminam no Service; entidades não são serializadas diretamente ###
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true

### Chaves persistentes para JWT RS256 (PKCS#8 privado e X.509 público) ###
olius.security.private-key-path=${OLIUS_JWT_PRIVATE_KEY_PATH:}
olius.security.public-key-path=${OLIUS_JWT_PUBLIC_KEY_PATH:}
olius.security.ephemeral-keys=${OLIUS_JWT_EPHEMERAL_KEYS:false}
olius.security.cookie-secure=${OLIUS_COOKIE_SECURE:true}
olius.security.cookie-same-site=${OLIUS_COOKIE_SAME_SITE:Strict}
olius.security.allowed-origins=${OLIUS_ALLOWED_ORIGINS:}


# Documentação pode ser habilitada por ambiente; não expõe dados de usuários.
springdoc.api-docs.enabled=${OLIUS_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${OLIUS_API_DOCS_ENABLED:false}

olius.security.auth-requests-per-minute=${OLIUS_AUTH_REQUESTS_PER_MINUTE:60}

### Stripe Checkout: integração sandbox com habilitação explícita por ambiente ###
olius.payments.stripe.enabled=${OLIUS_STRIPE_ENABLED:false}
olius.payments.stripe.secret-key=${STRIPE_SECRET_KEY:}
olius.payments.stripe.success-url=${OLIUS_CHECKOUT_SUCCESS_URL:}
olius.payments.stripe.cancel-url=${OLIUS_CHECKOUT_CANCEL_URL:}

# Validade da cobrança inicial aprovada: uma hora.
olius.payments.initial-checkout-ttl=${OLIUS_INITIAL_CHECKOUT_TTL:1h}

olius.payments.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Renovação manual: prazo independente da contratação inicial.
olius.payments.renewal-checkout-ttl=${OLIUS_RENEWAL_CHECKOUT_TTL:1h}

# Upgrade: prazo configurado maior que 35 minutos e no máximo uma hora; limitado também ao fim do ciclo.
olius.payments.upgrade-checkout-ttl=${OLIUS_UPGRADE_CHECKOUT_TTL:1h}



# Entrega SMTP de convites: explicitamente habilitada após configurar o canal.
olius.admin-invitations.email.enabled=${OLIUS_ADMIN_INVITATION_EMAIL_ENABLED:false}
olius.admin-invitations.email.from=${OLIUS_MAIL_FROM:}
olius.admin-invitations.email.acceptance-url=${OLIUS_ADMIN_INVITATION_ACCEPTANCE_URL:}
spring.mail.host=${OLIUS_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${OLIUS_MAIL_PORT:587}
spring.mail.username=${OLIUS_MAIL_USERNAME:}
spring.mail.password=${OLIUS_MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.ssl.checkserveridentity]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
spring.mail.properties[mail.debug]=false

# Recuperação independente dos convites; habilitar após SMTP, migração e página pública.
olius.password-reset.enabled=${OLIUS_PASSWORD_RESET_ENABLED:false}
olius.password-reset.url=${OLIUS_PASSWORD_RESET_URL:}
olius.password-reset.ttl=${OLIUS_PASSWORD_RESET_TTL:30m}
olius.password-reset.from=${OLIUS_MAIL_FROM:}
