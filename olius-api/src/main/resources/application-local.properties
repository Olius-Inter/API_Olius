# Perfil explícito para estudo local. Não ativar em produção.
# Caminho relativo ao diretório de execução, normalmente olius-api.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${CONTAINER_DEV_URL}
spring.datasource.username=${CONTAINER_DEV_USER}
spring.datasource.password=${CONTAINER_DEV_PASSWORD}

# Ajustes locais intencionais; os padrões seguros continuam no arquivo comum.
olius.security.ephemeral-keys=true
olius.security.cookie-secure=false
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
