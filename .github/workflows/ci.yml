name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Tests and Sonar
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: olius_test
          POSTGRES_USER: olius_ci
          POSTGRES_PASSWORD: olius_ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olius_ci -d olius_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: olius-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: olius-api/pom.xml

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x ./mvnw

      - name: Build, Test and Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/olius_test
          SPRING_DATASOURCE_USERNAME: olius_ci
          SPRING_DATASOURCE_PASSWORD: olius_ci_test_password
        run: |
          ./mvnw clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=Olius-Inter_API_Olius