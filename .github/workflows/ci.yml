name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '16.15'
            name: Build, Tests and Sonar
          - postgres: '18.6'
            name: Compatibility PostgreSQL 18.6
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: olius-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: olius-api/pom.xml

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x ./mvnw

      - name: Build and Test PostgreSQL
        run: ./mvnw clean verify -Dolius.test.postgres-image=postgres:${{ matrix.postgres }}

      - name: Sonar
        if: matrix.postgres == '16.15'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=Olius-Inter_API_Olius